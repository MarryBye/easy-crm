name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taxi_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taxi_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_HOST: localhost
      PG_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taxi_crm
      JWT_SECRET: ci_test_jwt_secret_key
      JWT_EXPIRATION: 120m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build applications
        run: pnpm build

      - name: Run Database Migrations & Seeds
        run: |
          pnpm --filter @easy-crm/backend run migration:run:dev
          pnpm --filter @easy-crm/backend run seed:run:dev

      - name: Run Backend Tests
        run: pnpm --filter @easy-crm/backend run test

      - name: Run Frontend Tests
        run: pnpm --filter @easy-crm/frontend run test
