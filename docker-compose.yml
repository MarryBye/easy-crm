services:
  postgres:
    image: postgres:16-alpine
    container_name: taxi-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taxi_crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taxi_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crm-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: taxi-crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      PG_HOST: postgres
      PG_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taxi_crm}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_taxi_crm_local_only}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-120m}
    ports:
      - "${PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: taxi-crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-network

volumes:
  postgres_data:
    driver: local

networks:
  crm-network:
    driver: bridge
